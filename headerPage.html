<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header Page</title>
    <link rel="stylesheet" href="/assets/css/main.css">

    <style>
        /* Header */
        .header-dynamic {
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 74vw;
            max-width: 1200px;
            height: 62px;
            padding: 6px 15px;
            background-color: var(--tp-dark-black-4);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            position: fixed;
            top: 0.75rem;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            pointer-events: auto;
            will-change: auto;
            transition: width 0.3s, padding 0.3s;
        }

        .header-dynamic:hover {
            transition: none;
        }

        .header-dynamic::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 2px;
            border-radius: inherit;
            background: #5a3bff;
            -webkit-mask: linear-gradient(white 0 0) content-box, linear-gradient(white 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .header-logo .logo_img {
            height: 38px;
            transition: opacity 0.3s;
        }

        .header-logo .logo_img_sm {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s, transform 0.3s;
        }

        .header-items {
            display: flex;
            align-items: center;
            margin: 0 auto;
            list-style: none;
            white-space: nowrap;
        }

        .header-items .header-item {
            margin: 0 4px;
        }

        .header-items .header-item-right {
            margin-left: 10rem;
        }

        .header-cv-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            font-size: 18px;
            color: #fff;
            border: 2px solid transparent;
            border-radius: 50%;
            position: relative;
        }

        .header-cv-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #4506d8, #bb33ed);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .header-cv-btn:hover {
            background-image: linear-gradient(45deg, #4506d8, #bb33ed);
            transform: rotate(-120deg);
        }

        .nav-link-custom {
            font-size: 1rem;
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            color: #5a3bff;
            border-radius: 30px;
            transition: background 0.3s, color 0.3s;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-link-custom:hover {
            background: white;
            color: rgba(95, 69, 242, 1);
        }

        .nav-link-custom.active {
            background: rgba(95, 69, 242, 1);
            color: white;
        }

        .header-langs {
            background: rgb(251, 239, 225);
            border-radius: 3rem;
            display: flex;
            align-items: center;
        }

        .langs-items {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .langs-item {
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            color: rgb(95, 69, 242);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .langs-items .active {
            background: rgb(95, 69, 242);
            color: white;
        }

        .header-dynamic.header-small {
            width: 200px;
            height: 55px;
            padding: 0;
            background: #5a3bff;
            transition: all 0.3s;
        }

        .header-small .logo_img {
            display: none;
        }

        .header-small .logo_img_sm {
            display: block;
            opacity: 1;
            transform: scale(1);
            height: 50px;
            margin-left: 3px;
        }

        .header-small .header-items .header-item {
            display: none;
        }

        .header-small .header-items .header-item:first-child {
            display: block;
        }

        .header-small .header-items .header-item:first-child .nav-link-custom {
            background: none;
            color: white;
        }

        /* Responsive */
        /* Mobile */
        @media (max-width: 768px) {
            .header-logo a img.logo_img {
                display: none;
                /* Ẩn logo lớn */
            }

            .header-logo a img.logo_img_sm {
                display: block;
                /* Hiển thị logo nhỏ */
                height: 30px;
                /* Điều chỉnh kích thước */
            }

            .header-items {
                display: none;
                /* Ẩn các mục menu */
            }

            .burger-menu {
                display: block;
                /* Hiển thị button burger */
            }

            .header-dynamic {
                padding: 10px;
                height: 50px;
            }

            .header-item.header-item-right {
                display: none;
                /* Ẩn nút CV */
            }
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .header-logo a img.logo_img {
                display: none;
                /* Ẩn logo lớn */
            }

            .header-logo a img.logo_img_sm {
                display: block;
                /* Hiển thị logo nhỏ */
                height: 40px;
                /* Điều chỉnh kích thước logo */
            }

            .header-items {
                display: none;
                /* Ẩn menu */
            }

            .burger-menu {
                display: block;
                /* Hiển thị button burger */
            }

            .header-dynamic {
                padding: 15px;
                height: 55px;
            }

            .header-item.header-item-right {
                display: block;
                /* Hiển thị lại nút CV */
            }
        }

        /* Laptop */
        @media (min-width: 1200px) {
            .header-logo a img.logo_img {
                display: block;
                /* Hiển thị logo lớn */
                height: 50px;
                /* Điều chỉnh kích thước logo */
            }

            .header-logo a img.logo_img_sm {
                display: none;
                /* Ẩn logo nhỏ */
            }

            .header-items {
                display: flex;
                /* Hiển thị menu */
            }

            .burger-menu {
                display: none;
                /* Ẩn button burger */
            }

            .header-dynamic {
                padding: 20px;
                height: 62px;
            }

            .header-item.header-item-right {
                display: block;
                /* Hiển thị nút CV */
            }
        }
    </style>

    <script>

        document.addEventListener("DOMContentLoaded", () => {
            const header = document.querySelector(".header-dynamic");
            const homeLink = document.querySelector(".header-items .header-item:first-child .nav-link-custom");
            if (!header) return;

            let lastScrollY = window.scrollY;

            const toggleHeader = (addSmall) => {
                header.classList.toggle("header-small", addSmall);
                const isRight = window.innerWidth / 2 < header.getBoundingClientRect().left;
                header.classList.toggle("right", addSmall && isRight);
                header.classList.toggle("left", addSmall && !isRight);
                if (homeLink) homeLink.classList.toggle("active", !addSmall);
            };

            window.addEventListener("scroll", () => {
                const currentScrollY = window.scrollY;
                toggleHeader(currentScrollY > 100);
                if (currentScrollY < lastScrollY) toggleHeader(false);
                lastScrollY = currentScrollY;
            });

            header.addEventListener("mouseenter", () => toggleHeader(false));
            header.addEventListener("mouseleave", () => {
                if (window.scrollY > 100) toggleHeader(true);
            });
        });
    </script>
</head>

<body>
    <header class="header-dynamic shadow">
        <!-- Logo -->
        <div class="header-logo">
            <a href="/">

        <!-- Nút Hamburger -->

        <!-- Menu -->

        <ul class="header-items">

            <li class="header-item contact-item"><a href="#contact" class="nav-link-custom">Contact</a></li>
            <li class="header-item header-item-right cv-item">
                <a class="tp-btn-white mt-2" href="/assets/CV/CV_UIUX Design_Trung.pdf" target="_blank">
                    <span class="text">CV</span>

            </li>
        </ul>
    </header>
