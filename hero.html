<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đào Nhật Trung - Visual Designer</title>
    <style>
      /* Base styles */
      body,
      html {
        margin: 0;
        padding: 0;
        font-family: "DM Sans", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #45495a;
        height: 100%;
        -webkit-font-smoothing: antialiased;
      }

      /* Hero section */
      .hero {
        background-color: #f6f9ff;
        padding: 200px 0 225px;
        position: relative;
        overflow: hidden;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        position: relative;
      }

      /* Social links */
      .social-links {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .social-link {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        margin-bottom: 20px;
        color: #171718;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .social-link:hover {
        color: #5a3bff;
      }

      /* Scroll indicator */
      .scroll-indicator {
        position: absolute;
        left: 40px;
        bottom: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .scroll-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        margin-bottom: 12px;
        font-weight: 500;
        color: #171718;
      }

      .scroll-line {
        width: 2px;
        height: 93px;
        background-color: #322ce4;
      }

      /* Content */
      .content {
        max-width: 800px;
      }

      .greeting {
        display: flex;
        align-items: center;
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 25px;
      }

      .hand-icon {
        width: 40px;
        height: 40px;
        margin-right: 8px;
        background-image: url("img/hero-hand.png");
        background-size: cover;
      }

      .heading {
        font-size: 133px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 25px;
      }

      .visual {
        background: linear-gradient(94deg, rgba(210, 113, 245, 1) 9%, rgba(49, 43, 228, 1) 86%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
      }

      .designer {
        color: #5a3bff;
      }

      .subheading {
        font-size: 30px;
        margin-bottom: 25px;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        background-color: #5a3aff;
        color: #ffffff;
        text-decoration: none;
        padding: 20px 30px;
        border-radius: 100px;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      .cta-button:hover {
        background-color: #4a2ee5;
      }

      .cta-icon {
        margin-left: 10px;
      }

      /* Responsive adjustments */
      @media (max-width: 1200px) {
        .heading {
          font-size: 100px;
        }
      }

      @media (max-width: 768px) {
        .hero {
          padding: 100px 0;
        }

        .heading {
          font-size: 60px;
        }

        .subheading {
          font-size: 24px;
        }

        .social-links,
        .scroll-indicator {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="container">
        <div class="content">
          <h1 class="greeting">
            <span class="hand-icon" aria-hidden="true"></span>
            Hello, I'm Đào Nhật Trung!
          </h1>
          <h2 class="heading"><span class="visual">VISUAL</span> <span class="designer">Designer</span></h2>
          <p class="subheading">Bringing creative ideas to life with stunning and intuitive designs.</p>
          <a href="https://dntrung044.github.io/projects.html" class="cta-button">
            View Portfolio
            <svg
              class="cta-icon"
              width="11"
              height="11"
              viewBox="0 0 11 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1 10L10 1M10 1H1M10 1V10"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </div>
      <nav class="social-links">
        <a href="https://www.facebook.com/dntrung044" class="social-link" target="_blank" rel="noopener noreferrer"
          >Facebook</a
        >
        <a href="https://www.youtube.com/dntrung044" class="social-link" target="_blank" rel="noopener noreferrer"
          >Youtube</a
        >
        <a
          href="https://dntrung044.github.io/behance.net/dntrung044"
          class="social-link"
          target="_blank"
          rel="noopener noreferrer"
          >Behance</a
        >
        <a href="https://dntrung044/" class="social-link" target="_blank" rel="noopener noreferrer">Github</a>
      </nav>
      <div class="scroll-indicator">
        <span class="scroll-text">SCROLL</span>
        <span class="scroll-line"></span>
      </div>
    </main>
  </body>
</html>
